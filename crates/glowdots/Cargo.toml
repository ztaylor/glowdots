[package]
name = "glowdots"
description = "A 1990s pinball dot matrix display (DMD) engine: plasma dots, glow, bloom, scenes, and transitions. Runs in a window, in the browser, or on a Raspberry Pi panel."
keywords = ["pinball", "dmd", "dot-matrix", "retro", "display"]
categories = ["graphics", "rendering", "games"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["desktop", "gif"]
# A window on macOS, Windows, and Linux desktops (winit + glutin), and
# offscreen rendering for screenshots.
desktop = ["dep:winit", "dep:glutin", "dep:glutin-winit", "dep:raw-window-handle"]
# Full screen through SDL2: a Raspberry Pi panel with no desktop (KMSDRM).
# Needs the SDL2 library (libsdl2-dev).
sdl = ["dep:sdl2"]
# Play in a web page: a canvas with WebGL 2 (target wasm32).
web = ["dep:wasm-bindgen", "dep:web-sys", "dep:js-sys"]
# Animated GIF export.
gif = ["dep:gif", "dep:color_quant"]

[package.metadata.docs.rs]
features = ["desktop", "gif"]

[[example]]
name = "hello"
required-features = ["desktop"]

[[example]]
name = "looks"
required-features = ["desktop"]

[dependencies]
anyhow.workspace = true
chrono.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
glow = "0.18"
winit = { version = "0.30", optional = true }
glutin = { version = "0.32", optional = true }
glutin-winit = { version = "0.5", optional = true }
raw-window-handle = { version = "0.6", optional = true }
sdl2 = { version = "0.38", optional = true }
gif = { version = "0.14", optional = true }
color_quant = { version = "1.1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "console",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "HtmlElement",
    "KeyboardEvent",
    "MouseEvent",
    "PointerEvent",
    "WebGl2RenderingContext",
    "Window",
] }
